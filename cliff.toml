# git-cliff configuration: https://git-cliff.org/docs/configuration
# CHANGELOG.md is generated from the commit subjects at release time.
# The header below must match the top of CHANGELOG.md exactly, which is
# how `git cliff --prepend` finds where to insert a new release.

[changelog]
# git-cliff trims each template line and drops the template's final
# newline (trim = true), and always adds one newline after the header: the
# escaped \n at the end of header and body is what leaves exactly one
# blank line between the header and a release, and between releases.
header = """
# Changelog

All notable changes to kelder are documented in this file.\n
"""
# The date is now(), the local date on the machine cutting the release:
# the date filter renders the release timestamp in UTC, which dates an
# evening release the next day.
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ now() | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% if commits | length == 0 %}
No user-visible changes.
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits | unique(attribute="message") %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Commits without a conventional subject are left out.
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# Only what someone running kelder would notice; docs, chore, ci and
# test commits are skipped. Renovate commits updates to the packages
# kelder is installed with as fix(deps), and to everything else (dev
# tools, the build backend, CI actions, the lock file) as chore(deps).
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix\\(deps\\)", group = "Dependencies" },
    { message = "^fix", group = "Fixed" },
    { message = "^(refactor|perf)", group = "Changed" },
    { message = ".*", skip = true },
]
