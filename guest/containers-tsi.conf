# smolvm/libkrun proxies guest sockets to the host (TSI). Inside a container
# network namespace a *connected* UDP socket can only send one datagram; later
# sends fail with EINVAL. glibc sends the A and AAAA queries on one socket, so
# DNS breaks (apt: "Temporary failure resolving"). single-request-reopen makes
# glibc use a fresh socket for the second query.
[containers]
dns_options = ["single-request-reopen"]
