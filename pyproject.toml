[project]
name = "kelder"
version = "0.0.6"
description = "Run Claude Code in a QEMU/KVM guest with host directories attached"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Adam Mercer" }]
dependencies = []

[project.scripts]
kelder = "kelder.cli:main"

[project.urls]
Repository = "https://github.com/skymoo/kelder"
Issues = "https://github.com/skymoo/kelder/issues"

[dependency-groups]
dev = [
    "git-cliff==2.14.2",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "ty==0.0.108",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
# testvm has no .py extension, so ruff would pass it by.
extend-include = [
    "src/kelder/guest/testvm",
]

[tool.ty.src]
# The same for ty, which is then told everything to check.
include = [
    "src",
    "tests",
    "src/kelder/guest/testvm",
]
